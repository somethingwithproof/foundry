name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          # Only the linter is built here; go.mod still targets 1.23. golangci-lint
          # v2 needs a newer toolchain to compile, and versions old enough for 1.23
          # mis-typecheck this module.
          go-version: "1.26"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      - name: Run golangci-lint
        run: golangci-lint run

  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: [self-hosted, linux, x64]
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Build
        run: make build
      - name: Verify binary
        run: ./bin/anvil version
